<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Couple Diary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <a href="index.html" class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        Couple Diary
      </a>
      <a href="dashboard.html" class="btn btn-secondary" style="padding: 6px 12px; font-size: 14px;">Dashboard</a>
    </header>

    <div style="text-align: center; margin: 30px 0;">
      <h1 style="font-size: clamp(28px, 6vw, 40px); margin-bottom: 10px;">Our Private Space</h1>
      <p style="color: var(--text-muted); font-size: 16px;">Secure messages, shared whiteboard, and memories for just the two of you.</p>
    </div>

    <div class="card" style="text-align: center;">
      <h3 style="margin-bottom: 16px;">Enter Couple Code or Name</h3>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <input type="text" id="coupleCode" placeholder="e.g. Romeo & Juliet or secret code">
        <input type="text" id="userName" placeholder="Your Name (e.g. Romeo)">
        
        <div style="margin-top: 10px; text-align: left;">
          <label style="font-size: 14px; color: var(--text-muted); display: block; margin-bottom: 6px;">Upload Profile Photo</label>
          <input type="file" id="photoInput" accept="image/*">
        </div>

        <div class="round-avatar" id="previewAvatar" style="margin: 10px auto;">
          <svg width="24" height="24" fill="none" stroke="var(--text-muted)" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>

        <button class="btn" id="enterBtn" style="width: 100%; margin-top: 10px;">Open Our Diary</button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;">
      <a href="chat.html" class="card" style="text-decoration: none; color: inherit; text-align: center; padding: 16px;">
        <svg width="28" height="28" fill="none" stroke="var(--accent)" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <h4 style="margin-top: 8px;">Chat</h4>
      </a>
      <a href="whiteboard.html" class="card" style="text-decoration: none; color: inherit; text-align: center; padding: 16px;">
        <svg width="28" height="28" fill="none" stroke="var(--accent)" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        <h4 style="margin-top: 8px;">Whiteboard</h4>
      </a>
    </div>
  </div>

  <script>
    const photoInput = document.getElementById('photoInput');
    const previewAvatar = document.getElementById('previewAvatar');
    let base64Photo = '';

    photoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          base64Photo = event.target.result;
          previewAvatar.innerHTML = `<img src="${base64Photo}" alt="Avatar">`;
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('enterBtn').addEventListener('click', () => {
      const code = document.getElementById('coupleCode').value.trim() || 'DefaultCouple';
      const name = document.getElementById('userName').value.trim() || 'Partner';
      
      localStorage.setItem('couple_code', code);
      localStorage.setItem('couple_username', name);
      if (base64Photo) {
        localStorage.setItem('couple_photo', base64Photo);
      }
      
      window.location.href = 'chat.html';
    });
  </script>
</body>
</html>
