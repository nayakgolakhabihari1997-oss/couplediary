<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whiteboard - Couple Diary</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: var(--bg-chat);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .board-header {
      background-color: var(--bg-panel);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }
    .canvas-container {
      flex: 1;
      position: relative;
      background-color: var(--bg-panel);
      margin: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      touch-action: none;
      background-color: #1a2630;
      cursor: crosshair;
    }
    .toolbar {
      background-color: var(--bg-panel);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border-color);
      gap: 10px;
      flex-wrap: wrap;
    }
    .colors {
      display: flex;
      gap: 8px;
    }
    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .color-btn.active {
      border-color: #fff;
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <div class="board-header">
    <div class="flex-row" style="gap: 10px;">
      <a href="chat.html" style="color: var(--text-main); text-decoration: none; display: flex; align-items: center;">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </a>
      <div>
        <div id="coupleTitle" style="font-weight: 600; font-size: 15px;">Shared Whiteboard</div>
        <div style="font-size: 12px; color: var(--text-muted);">Draw together ❤️</div>
      </div>
    </div>
    <a href="dashboard.html" class="btn btn-secondary" style="padding: 6px 10px; font-size: 13px;">Dashboard</a>
  </div>

  <div class="canvas-container" id="canvasBox">
    <canvas id="paintCanvas"></canvas>
  </div>

  <div class="toolbar">
    <div class="colors">
      <button class="color-btn active" style="background-color: #00a884;" data-color="#00a884"></button>
      <button class="color-btn" style="background-color: #ff5252;" data-color="#ff5252"></button>
      <button class="color-btn" style="background-color: #ffeb3b;" data-color="#ffeb3b"></button>
      <button class="color-btn" style="background-color: #ffffff;" data-color="#ffffff"></button>
      <button class="color-btn" style="background-color: #2196f3;" data-color="#2196f3"></button>
    </div>
    <div class="flex-row" style="gap: 8px;">
      <button class="btn btn-secondary" id="clearBtn" style="padding: 6px 12px; font-size: 14px;">Clear</button>
      <button class="btn" id="saveBtn" style="padding: 6px 14px; font-size: 14px;">Save</button>
    </div>
  </div>

  <script>
    const code = localStorage.getItem('couple_code') || 'DefaultCouple';
    document.getElementById('coupleTitle').textContent = code + ' Whiteboard';

    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvasBox');

    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      tempCanvas.width = canvas.width || rect.width;
      tempCanvas.height = canvas.height || rect.height;
      tempCtx.drawImage(canvas, 0, 0);

      canvas.width = rect.width;
      canvas.height = rect.height;
      
      // restore background & drawing
      ctx.fillStyle = '#1a2630';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(tempCanvas, 0, 0);
      loadSavedDrawing();
    }

    window.addEventListener('resize', resizeCanvas);
    
    // Initial size setup
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
    ctx.fillStyle = '#1a2630';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const storageKey = 'couple_board_' + code;

    function loadSavedDrawing() {
      const saved = localStorage.getItem(storageKey);
      if (saved) {
        const img = new Image();
        img.onload = () => {
          ctx.drawImage(img, 0, 0);
        };
        img.src = saved;
      }
    }

    loadSavedDrawing();

    let painting = false;
    let currentColor = '#00a884';
    let lineWidth = 4;

    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentColor = e.target.getAttribute('data-color');
      });
    });

    function startPosition(e) {
      painting = true;
      draw(e);
    }

    function endPosition() {
      painting = false;
      ctx.beginPath();
      saveDrawing();
    }

    function draw(e) {
      if (!painting) return;
      e.preventDefault();

      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'round';
      ctx.strokeStyle = currentColor;

      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    function saveDrawing() {
      localStorage.setItem(storageKey, canvas.toDataURL());
    }

    canvas.addEventListener('mousedown', startPosition);
    canvas.addEventListener('mouseup', endPosition);
    canvas.addEventListener('mousemove', draw);

    canvas.addEventListener('touchstart', startPosition);
    canvas.addEventListener('touchend', endPosition);
    canvas.addEventListener('touchmove', draw);

    document.getElementById('clearBtn').addEventListener('click', () => {
      ctx.fillStyle = '#1a2630';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      localStorage.removeItem(storageKey);
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      saveDrawing();
      alert('Whiteboard saved successfully! ❤️');
    });
  </script>
</body>
</html>
